name: Build jar

'on':
push: {}
workflow_dispatch: {}

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

```
  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.14.3'

  - name: Locate Gradle project
    run: |
      find . -maxdepth 5 \( -name build.gradle -o -name build.gradle.kts \) -print

  - name: Build addon
    run: |
      cd auto-build-addon/auto-build-addon
      sed -i 's/1\.11\.8/1.14.10/g; s/1\.11-SNAPSHOT/1.14.10/g' build.gradle
      gradle build --no-daemon

  - uses: actions/upload-artifact@v4
    with:
      name: auto-build-addon
      path: auto-build-addon/auto-build-addon/build/libs/*.jar
      if-no-files-found: error
```

